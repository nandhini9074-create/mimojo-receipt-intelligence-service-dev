services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: receipt
      POSTGRES_PASSWORD: receipt
      POSTGRES_DB: receipt_intelligence
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U receipt -d receipt_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://receipt:receipt@db:5432/receipt_intelligence
      ENVIRONMENT: dev
      OTEL_SERVICE_NAME: mimojo-receipt-intelligence
      OTEL_EXPORTER_OTLP_ENDPOINT: http://80.238.219.232:4318
    depends_on:
      db:
        condition: service_healthy
